<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendly Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="check-icon">✓</span> <strong>Attendly Dashboard</strong> 📚
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">Home</a>
            <button id="logoutBtn" class="logout-link-btn">Logout</button>
        </nav>
    </header>

    <main class="dashboard-container">
        <!-- Dashboard Card Outer Wrapper -->
        <div class="main-card">
            
            <div class="card-header">
                <h1 id="welcomeTitle">Dashboard - All Registered Students Loop 📚</h1>
            </div>

            <!-- Stats Grid (Counters) -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h2 id="totalCount" class="stat-number">0</h2>
                    <p class="stat-label">Total</p>
                </div>
                <!-- Register Student Button -->
<div class="action-bar" style="margin: 20px 0;">
  <button id="addStudentBtn" class="btn" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">+ Register New Student</button>
  <button id="clearAllBtn" class="btn" style="background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">Clear All</button>
</div>

<!-- Attendance Table -->
<div class="table-responsive">
  <table class="attendance-table" style="width: 100%; border-collapse: collapse; background: white; margin-top: 20px;">
    <thead>
      <tr style="background: #28a745; color: white; text-align: left;">
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Name</th>
        <th style="padding: 10px;">Dept</th>
        <th style="padding: 10px;">Status</th>
        <th style="padding: 10px;">Date & Time</th>
        <th style="padding: 10px;">Action</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      <!-- Dynamic student rows will appear here -->
    </tbody>
  </table>
</div>

<!-- Student Modal Pop-up -->
<div id="studentModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
  <div class="modal-content" style="background: white; width: 300px; margin: 100px auto; padding: 20px; border-radius: 8px;">
    <span id="closeModalBtn" style="float: right; cursor: pointer; font-size: 20px; font-weight: bold;">&times;</span>
    <h3>Register New Student</h3>
    <form id="studentForm" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
      <input type="text" id="studentName" placeholder="Student Name" required style="padding: 8px;">
      <input type="text" id="studentId" placeholder="Student ID" required style="padding: 8px;">
      <input type="text" id="studentDept" placeholder="Department" required style="padding: 8px;">
      <button type="submit" style="padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Add Student</button>
    </form>
  </div>
</div>
<div class="stat-card">
                  <!-- PASTE THE CODE BLOCK RIGHT HERE -->  
                    <h2 id="presentCount" class="stat-number green-text">0</h2>
                    <p class="stat-label">Present</p>
                </div>
                <div class="stat-card">
                    <h2 id="absentCount" class="stat-number red-text">0</h2>
                    <p class="stat-label">Absent</p>
                </div>
                <div class="stat-card">
                    <h2 id="notMarkedCount" class="stat-number orange-text">0</h2>
                    <p class="stat-label">Not Marked</p>
                </div>
            </div>

            <!-- Role-based Controls & Table -->
            <div id="managementSection">
                <!-- Attendance Table -->
                <div class="table-responsive">
                    <table class="attendly-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Dept</th>
                                <th>Status</th>
                                <th>Date & Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Table rows dynamically populated by script.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Action Buttons Footer (Admin / Coordinator) -->
                <div id="adminControls" class="action-footer">
                    <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
                    <button id="openModalBtn" class="btn btn-primary">+ Register New Student</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Register New Student Modal -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>Register New Student</h2>
            <form id="addStudentForm">
                <div class="form-group">
                    <label for="studentId">Student Index/ID</label>
                    <input type="text" id="studentId" required placeholder="e.g. 01255249D">
                </div>
                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" required placeholder="e.g. Samuel Otoo">
                </div>
                <div class="form-group">
                    <label for="studentDept">Department</label>
                    <input type="text" id="studentDept" required placeholder="e.g. Computer Science">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Add Student</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
